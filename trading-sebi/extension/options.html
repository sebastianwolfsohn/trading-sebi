<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trading Sebi</title>
  <style>
    :root { color-scheme: dark; }
    body { font: 14px/1.45 system-ui, sans-serif; background: #0b0e14; color: #e2e8f0; margin: 0; padding: 16px; min-width: 340px; }
    h1 { font-size: 16px; margin: 0 0 12px; }
    h1 span { color: #6366f1; }
    label { display: block; margin: 10px 0 4px; font-size: 12px; color: #8b95a7; text-transform: uppercase; letter-spacing: .04em; }
    input[type=text], input[type=password], input[type=url] { width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 8px; border: 1px solid #222a38; background: #121722; color: inherit; }
    .row { display: flex; gap: 8px; margin-top: 14px; }
    button { padding: 8px 12px; border-radius: 8px; border: 0; background: #6366f1; color: #fff; cursor: pointer; }
    button.ghost { background: transparent; border: 1px solid #222a38; color: #e2e8f0; }
    .card { border: 1px solid #222a38; background: #121722; border-radius: 10px; padding: 10px 12px; margin-top: 14px; font-size: 13px; }
    .ok { color: #22c55e; } .err { color: #ef4444; } .muted { color: #8b95a7; font-size: 12px; }
    .check { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; color: #e2e8f0; text-transform: none; letter-spacing: 0; }
  </style>
</head>
<body>
  <h1>Trading <span>Sebi</span></h1>

  <label for="endpoint">URL de tu journal</label>
  <input id="endpoint" type="url" placeholder="https://trading-sebi.vercel.app" />

  <label for="token">Token (INGEST_TOKEN)</label>
  <input id="token" type="password" placeholder="El mismo valor que pusiste en Vercel" />

  <label for="defaultAccount">Cuenta por defecto</label>
  <input id="defaultAccount" type="text" placeholder="Nombre exacto en Tradovate, ej. APEX-12345-01" />
  <div class="muted">Se usa solo si no se puede detectar la cuenta del fill.</div>

  <label class="check"><input id="debug" type="checkbox" /> Modo diagnóstico (muestra lo que detecta en la consola de TradingView)</label>

  <div class="row">
    <button id="save">Guardar</button>
    <button id="test" class="ghost">Probar conexión</button>
    <button id="flush" class="ghost">Reenviar pendientes</button>
  </div>
  <div id="msg" class="muted" style="margin-top:8px"></div>

  <div class="card" id="status">Cargando estado…</div>

  <script src="options.js"></script>
</body>
</html>
